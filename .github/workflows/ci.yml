name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.classify.outputs.checks }}
      release: ${{ steps.classify.outputs.release }}
    steps:
      - id: classify
        env:
          COMMIT_MSG: ${{ github.event.pull_request.title || github.event.head_commit.message }}
        run: |
          set -euo pipefail
          first="$(printf '%s\n' "${COMMIT_MSG:-}" | head -n1 | tr -d '\r')"
          type=""
          if [[ "$first" =~ ^([A-Za-z]+)(\([^)]*\))?(!)?: ]]; then
            type="${BASH_REMATCH[1],,}"
          fi
          checks=true
          release=true
          case "$type" in
            docs)
              checks=false
              release=false
              ;;
            ci|refactor)
              release=false
              ;;
          esac
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  test:
    name: test
    needs: classify
    if: needs.classify.outputs.checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  build:
    name: build
    needs: classify
    if: needs.classify.outputs.checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: minitcp:ci
          outputs: type=cacheonly
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  status:
    name: status
    needs: [classify, test, build]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Require test and build unless skipped
        env:
          CHECKS: ${{ needs.classify.outputs.checks }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          if [ "$CHECKS" != "true" ]; then
            exit 0
          fi
          [ "$TEST" = success ] && [ "$BUILD" = success ]

  release:
    name: release
    needs: [classify, test, build]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.classify.outputs.release == 'true' && needs.test.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cycjimmy/semantic-release-action@v4
        id: release
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: steps.release.outputs.new_release_published == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
        if: steps.release.outputs.new_release_published == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.release.outputs.new_release_published == 'true'
      - uses: docker/metadata-action@v5
        if: steps.release.outputs.new_release_published == 'true'
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.release.outputs.new_release_version }}
      - uses: docker/build-push-action@v6
        if: steps.release.outputs.new_release_published == 'true'
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
