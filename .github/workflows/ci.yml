name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.classify.outputs.checks }}
      platforms: ${{ steps.classify.outputs.platforms }}
    steps:
      - id: classify
        env:
          COMMIT_MSG: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          first="$(printf '%s\n' "${COMMIT_MSG:-}" | head -n1 | tr -d '\r')"
          prefix="${first%%:*}"
          prefix="${prefix%%(*}"
          prefix="${prefix%!}"
          type="$(printf '%s' "$prefix" | tr '[:upper:]' '[:lower:]')"
          checks=true
          case "$type" in
            docs)
              checks=false
              ;;
          esac
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
          {
            echo "platforms<<EOF"
            if [ "$EVENT" = pull_request ]; then
              echo '[{"runner":"ubuntu-latest","platform":"linux/amd64"}]'
            else
              echo '[{"runner":"ubuntu-latest","platform":"linux/amd64"},{"runner":"ubuntu-24.04-arm","platform":"linux/arm64"}]'
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  test:
    name: test
    needs: classify
    if: needs.classify.outputs.checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  build:
    name: build (${{ matrix.platform }})
    needs: classify
    if: needs.classify.outputs.checks == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.classify.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          tags: minitcp:ci
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }},ignore-error=true

  status:
    name: status
    needs: [classify, test, build]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Require test and build unless skipped
        env:
          CHECKS: ${{ needs.classify.outputs.checks }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          if [ "$CHECKS" != "true" ]; then
            exit 0
          fi
          [ "$TEST" = success ] && [ "$BUILD" = success ]

  release:
    name: release
    needs: [test, build]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cycjimmy/semantic-release-action@v4
        id: release
        with:
          extra_plugins: |
            @semantic-release/changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: peter-evans/create-pull-request@v7
        if: steps.release.outputs.new_release_published == 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: changelog for ${{ steps.release.outputs.new_release_version }}"
          branch: chore/changelog-${{ steps.release.outputs.new_release_version }}
          title: "docs: changelog for ${{ steps.release.outputs.new_release_version }}"
          body: |
            Updates `docs/CHANGELOG.md` for [${{ steps.release.outputs.new_release_version }}](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.release.outputs.new_release_version }}).

            Notes are already on the GitHub Release. Merge this PR to keep the file in the repo.
          add-paths: docs/CHANGELOG.md
          delete-branch: true
      - uses: docker/login-action@v3
        if: steps.release.outputs.new_release_published == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
        if: steps.release.outputs.new_release_published == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.release.outputs.new_release_published == 'true'
      - uses: docker/metadata-action@v5
        if: steps.release.outputs.new_release_published == 'true'
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.release.outputs.new_release_version }}
      - uses: docker/build-push-action@v6
        if: steps.release.outputs.new_release_published == 'true'
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
