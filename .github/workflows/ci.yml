name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.classify.outputs.checks }}
      platforms: ${{ steps.classify.outputs.platforms }}
    steps:
      - id: classify
        env:
          COMMIT_MSG: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          first="$(printf '%s\n' "${COMMIT_MSG:-}" | head -n1 | tr -d '\r')"
          prefix="${first%%:*}"
          prefix="${prefix%%(*}"
          prefix="${prefix%!}"
          type="$(printf '%s' "$prefix" | tr '[:upper:]' '[:lower:]')"
          checks=true
          case "$type" in
            docs)
              checks=false
              ;;
          esac
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
          {
            echo "platforms<<EOF"
            if [ "$EVENT" = pull_request ]; then
              echo '[{"runner":"ubuntu-latest","platform":"linux/amd64","arch":"amd64"}]'
            else
              echo '[{"runner":"ubuntu-latest","platform":"linux/amd64","arch":"amd64"},{"runner":"ubuntu-24.04-arm","platform":"linux/arm64","arch":"arm64"}]'
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  test:
    name: test
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - name: Skip tests
        if: needs.classify.outputs.checks != 'true'
        run: echo "docs-only; test not required"
      - uses: actions/checkout@v4
        if: needs.classify.outputs.checks == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.classify.outputs.checks == 'true'
      - run: cargo test
        if: needs.classify.outputs.checks == 'true'

  build:
    name: build (${{ matrix.platform }})
    needs: classify
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.classify.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Skip image build
        if: needs.classify.outputs.checks != 'true'
        run: echo "docs-only; image build not required"
      - uses: actions/checkout@v4
        if: needs.classify.outputs.checks == 'true'
      - uses: docker/login-action@v3
        if: needs.classify.outputs.checks == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        if: needs.classify.outputs.checks == 'true'
      - uses: docker/build-push-action@v6
        if: needs.classify.outputs.checks == 'true'
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('ghcr.io/{0}:sha-{1}-{2}', github.repository, github.sha, matrix.arch) || 'minitcp:ci' }}
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || '' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }},ignore-error=true

  status:
    name: status
    needs: [classify, test, build]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Require test and build
        env:
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          [ "$TEST" = success ] && [ "$BUILD" = success ]

  release:
    name: release
    needs: [classify, test, build]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.classify.outputs.checks == 'true' && needs.test.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.release.outputs.new_release_published }}
      version: ${{ steps.release.outputs.new_release_version }}
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cycjimmy/semantic-release-action@v4
        id: release
        with:
          extra_plugins: |
            @semantic-release/changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: peter-evans/create-pull-request@v7
        if: steps.release.outputs.new_release_published == 'true'
        id: changelog
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: changelog for ${{ steps.release.outputs.new_release_version }}"
          branch: chore/changelog-${{ steps.release.outputs.new_release_version }}
          title: "docs: changelog for ${{ steps.release.outputs.new_release_version }}"
          body: |
            Updates `docs/CHANGELOG.md` for [${{ steps.release.outputs.new_release_version }}](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.release.outputs.new_release_version }}).

            Notes are already on the GitHub Release. Merge this PR to keep the file in the repo.
          add-paths: docs/CHANGELOG.md
          delete-branch: true
      - name: Mark changelog PR checks
        if: steps.changelog.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.changelog.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          for name in test build "build (linux/amd64)" status; do
            gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
              -f name="$name" \
              -f head_sha="$SHA" \
              -f status=completed \
              -f conclusion=success
          done
      - uses: docker/login-action@v3
        if: steps.release.outputs.new_release_published == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        if: steps.release.outputs.new_release_published == 'true'
      - name: Retag SHA images as version and latest
        if: steps.release.outputs.new_release_published == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.release.outputs.new_release_version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:sha-${SHA}-amd64" \
            "${IMAGE}:sha-${SHA}-arm64"
      - name: Upload install.sh
        if: steps.release.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.new_release_version }}
        run: gh release upload "v${VERSION}" scripts/install.sh --clobber

  host-binaries:
    name: host-binaries (${{ matrix.asset }})
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            asset: minitcp-aarch64-apple-darwin
          - runner: macos-13
            asset: minitcp-x86_64-apple-darwin
          - runner: ubuntu-latest
            asset: minitcp-x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            asset: minitcp-aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
        env:
          MINITCP_RELEASE: ${{ needs.release.outputs.version }}
      - run: cp target/release/minitcp "${{ matrix.asset }}"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh release upload "v${VERSION}" "${{ matrix.asset }}" --clobber
